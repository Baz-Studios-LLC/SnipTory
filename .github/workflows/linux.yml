name: Build Linux app
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Native build and clipboard dependencies
        run: |
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libfontconfig1-dev wl-clipboard libfuse2t64
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo build --locked --release
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet tool install vpk --version 1.2.161 --tool-path .tools/vpk
      - run: bash scripts/Package-Linux.sh --skip-build
      - uses: actions/upload-artifact@v4
        with:
          name: SnipTory-linux-x64
          path: dist/v*-linux-x64/*
          if-no-files-found: error
