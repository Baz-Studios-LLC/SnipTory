[package]
name = "sniptory"
version = "0.0.15"
license = "MIT"
authors = ["Baz Studios LLC"]
repository = "https://github.com/Baz-Studios-LLC/SnipTory"
edition = "2024"
description = "Capture. Recall. Paste. A visual memory utility."
publish = false
build = "build.rs"

[dependencies]
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png", "gif"] }
rusqlite = { version = "0.41", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
gif = "0.14"
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-18", "raw-window-handle-06"] }
raw-window-handle = "0.6"
velopack = "=1.2.161"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm",
    "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_LibraryLoader",
    "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_Security", "Win32_System_Registry", "Win32_UI_Accessibility"
] }

[target.'cfg(target_os = "macos")'.dependencies]
arboard = "3.7.0"
fs2 = "0.4.3"
global-hotkey = "0.9.0"
tray-icon = { version = "0.26.1", default-features = false }

[build-dependencies]
slint-build = "=1.18.1"
winresource = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
