name: Package and release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet tool install vpk --version 1.2.161 --tool-path .tools/vpk
      - run: cargo test --locked
      - name: Package installer and update feed
        shell: pwsh
        run: ./scripts/Package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: SnipTory-windows
          path: dist/v*/*
          if-no-files-found: error
  macos:
    uses: ./.github/workflows/macos.yml
  linux:
    uses: ./.github/workflows/linux.yml
  publish:
    needs: [windows, macos, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: SnipTory-*
          path: dist/release
          merge-multiple: true
      - name: Publish all platform feeds together
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$(tr -d '\r\n' < VERSION)"
          mapfile -d '' assets < <(find dist/release -type f -print0)
          test "${#assets[@]}" -gt 0
          gh release create "$tag" "${assets[@]}" --title "SnipTory $tag" --notes-file "release-notes/$tag.md" --target "$GITHUB_SHA" --latest
